[package]
name = "killer"
version = "0.1.0"
description = "A Tauri App — Go filesystem sidecar + Rust IPC tunnel"
authors = ["you"]
edition = "2021"

[lib]
name = "killer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- Go Bridge dependencies ---
# tokio es el runtime async que ya usa Tauri internamente.
# Lo declaramos explícito para usar `tokio::process::Command` y `AsyncReadExt`.
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
